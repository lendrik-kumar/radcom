<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Radcom</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Main View: Chats List -->
  <div id="view-main" class="view active">
    <header class="app-bar">
      <h1>Radcom</h1>
      <div id="conn-status" class="status-badge state-disconnected" title="Not connected to node"></div>
      <button id="btn-settings" class="icon-btn">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
      </button>
    </header>
    
    <div id="chats-list" class="scrollable-content">
      <!-- Chat items injected here -->
    </div>
    
    <button id="btn-fab-add" class="fab">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </button>
  </div>

  <!-- Chat View -->
  <div id="view-chat" class="view slide-right">
    <header class="app-bar">
      <button id="btn-back" class="icon-btn">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <h1 id="chat-title">Contact Name</h1>
    </header>
    
    <div id="chat-messages" class="scrollable-content messages-container">
      <!-- Bubbles injected here -->
    </div>
    
    <div class="chat-input-bar">
      <input type="text" id="chat-input" placeholder="Message" autocomplete="off">
      <button id="btn-send" class="icon-btn primary-text">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <!-- Modals Layer -->
  <div id="modal-overlay" class="overlay hidden"></div>

  <!-- Onboarding Modal -->
  <div id="modal-onboarding" class="modal hidden">
    <h2>Welcome to Radcom</h2>
    <p>Set your local identity to join the mesh.</p>
    <div class="input-group">
      <label>Phone Number</label>
      <input type="tel" id="input-own-phone" placeholder="e.g. 919876543210">
    </div>
    <div class="input-group">
      <label>Display Name (Optional)</label>
      <input type="text" id="input-own-name" placeholder="Your Name">
    </div>
    <button id="btn-save-identity" class="btn-primary">Continue</button>
  </div>

  <!-- Add Contact / New Chat Modal -->
  <div id="modal-add-contact" class="modal hidden">
    <h2>New Chat</h2>
    <div class="input-group">
      <label>Phone Number</label>
      <input type="tel" id="input-contact-phone" placeholder="e.g. 919876543210">
    </div>
    <div class="input-group">
      <label>Name (Optional)</label>
      <input type="text" id="input-contact-name" placeholder="Contact Name">
    </div>
    <div class="modal-actions">
      <button id="btn-cancel-contact" class="btn-text">Cancel</button>
      <button id="btn-save-contact" class="btn-primary">Chat</button>
    </div>
  </div>
  
  <!-- Settings Modal -->
  <div id="modal-settings" class="modal hidden">
    <h2>Settings</h2>
    <div class="identity-card">
      <div class="label">Your Identity</div>
      <div id="settings-phone" class="value">--</div>
      <div class="note">This is not a verified identity.</div>
    </div>
    <div class="status-card">
      <div class="label">Connection</div>
      <div id="settings-conn-text" class="value">Not connected</div>
    </div>
    <div class="modal-actions">
      <button id="btn-logout" class="btn-text" style="color: var(--error-color);">Logout</button>
      <button id="btn-close-settings" class="btn-primary">Close</button>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/ws.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
